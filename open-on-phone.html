<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buka di HP — Train TV</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#07111D;
  color:#F0F4F8;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:32px 24px;
}
.card{
  width:100%;
  max-width:380px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:28px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  justify-content:center;
}
.badge{
  background:#E8642A;
  color:#fff;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  padding:5px 10px;
  border-radius:6px;
}
.brand-name{
  font-size:16px;
  font-weight:800;
  color:#F0F4F8;
}
.title{
  font-size:13px;
  color:#3D5A7A;
  letter-spacing:1px;
  text-transform:uppercase;
  font-weight:700;
}
.qr-wrap{
  background:#F0F4F8;
  padding:16px;
  border-radius:16px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 40px rgba(232,100,42,.2);
}
.qr-wrap img{
  display:block;
  border-radius:4px;
  image-rendering:pixelated;
}
.divider{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
}
.divider::before,.divider::after{
  content:'';
  flex:1;
  height:1px;
  background:#1E3A55;
}
.divider-text{
  font-size:10px;
  color:#3D5A7A;
  letter-spacing:1px;
  text-transform:uppercase;
  white-space:nowrap;
}
.url-box{
  background:#0F1E30;
  border:1px solid #1E3A55;
  border-radius:12px;
  padding:14px 16px;
  font-size:13px;
  color:#8FA8C4;
  word-break:break-all;
  line-height:1.6;
  width:100%;
  cursor:pointer;
  transition:border-color .2s;
  font-family:monospace;
}
.url-box:hover{border-color:#E8642A;}
.btn{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  font-family:inherit;
  transition:opacity .15s,transform .15s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.btn:active{transform:scale(.97);opacity:.9;}
.btn-primary{background:#E8642A;color:#fff;}
.btn-secondary{
  background:#0F1E30;
  border:1px solid #1E3A55;
  color:#8FA8C4;
}
.hint{
  font-size:11px;
  color:#3D5A7A;
  line-height:1.6;
}
.toast{
  position:fixed;
  bottom:32px;
  left:50%;
  transform:translateX(-50%) translateY(16px);
  background:#1E3A55;
  color:#F0F4F8;
  padding:10px 20px;
  border-radius:20px;
  font-size:13px;
  font-weight:600;
  opacity:0;
  transition:opacity .2s,transform .2s;
  pointer-events:none;
  white-space:nowrap;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>
<body>
<div class="card">

  <div>
    <div class="brand" style="margin-bottom:6px">
      <span class="badge">KAI</span>
      <span class="brand-name">Train TV Display</span>
    </div>
    <div class="title">Scan QR untuk buka di HP</div>
  </div>

  <div class="qr-wrap">
    <img id="qrImg" width="200" height="200" alt="QR Code">
  </div>

  <div class="divider"><span class="divider-text">atau ketik URL ini</span></div>

  <div class="url-box" id="urlBox" onclick="copyUrl()"></div>

  <button class="btn btn-primary" onclick="copyUrl()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <rect x="9" y="9" width="13" height="13" rx="2"/>
      <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
    </svg>
    Salin URL
  </button>

  <button class="btn btn-secondary" onclick="openDirect()">
    Buka di Tab Baru
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
      <polyline points="15 3 21 3 21 9"/>
      <line x1="10" y1="14" x2="21" y2="3"/>
    </svg>
  </button>

  <div class="hint">
    Arahkan kamera HP ke QR code di atas.<br>
    Tidak perlu app khusus — cukup browser bawaan.
  </div>

</div>

<div class="toast" id="toast">URL disalin!</div>

<script>
const TARGET = 'https://sandmanz26.github.io/Copymaster/train-tv.html';

document.getElementById('urlBox').textContent = TARGET;

// QR code via goqr.me API (free, no account needed)
document.getElementById('qrImg').src =
  'https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data=' +
  encodeURIComponent(TARGET);

function copyUrl() {
  navigator.clipboard.writeText(TARGET).then(() => showToast('URL disalin!'));
}

function openDirect() {
  window.open(TARGET, '_blank');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
</body>
</html>
