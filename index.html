<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="copymaster">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<title>copymaster</title>
<style>
/* ── Reset ─────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root {
  --bg:       #0f0f17;
  --surface:  #1a1a28;
  --surface2: #22223a;
  --border:   #2e2e4a;
  --primary:  #7c6df0;
  --pri-d:    #5b4dcf;
  --accent:   #a78bfa;
  --text:     #e2e0f0;
  --text-2:   #9896b8;
  --text-3:   #5e5c7a;
  --green:    #34d399;
  --red:      #f87171;
  --r:        16px;
  --r-sm:     10px;
  --shadow:   0 8px 32px rgba(0,0,0,.5);
  --ease:     .22s cubic-bezier(.4,0,.2,1);
  --nav:      .32s cubic-bezier(.4,0,.2,1);
  --st: env(safe-area-inset-top,0px);
  --sb: env(safe-area-inset-bottom,0px);
}
[data-theme="light"]{
  --bg:#f0f0f8; --surface:#fff; --surface2:#eeeef6; --border:#dcdce8;
  --text:#1a1a2e; --text-2:#5a5a8a; --text-3:#aaaacc;
  --shadow:0 8px 32px rgba(0,0,0,.1);
}

html{height:100%;-webkit-tap-highlight-color:transparent;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100%;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}

/* ── Screen System ──────────────────────────────────── */
.screen{
  position:fixed;inset:0;
  background:var(--bg);
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform var(--nav);
  will-change:transform;
  z-index:10;
}
#screen-home{transform:translateX(0);} /* home always visible */
.screen.active{transform:translateX(0);}
.screen.behind{transform:translateX(-28%);}

.scroll-body{
  flex:1;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}

/* ── Shared Header ──────────────────────────────────── */
.hdr{
  padding:calc(14px + var(--st)) 16px 14px;
  display:flex;align-items:center;gap:10px;
  background:var(--bg);flex-shrink:0;
  position:relative;
}
.hdr::after{
  content:'';position:absolute;bottom:0;left:0;right:0;
  height:1px;background:var(--border);opacity:.6;
}

.logo-text{
  font-size:21px;font-weight:800;letter-spacing:-.3px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;flex:1;
}
.hdr-title{
  font-size:17px;font-weight:700;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.icon-btn{
  width:38px;height:38px;border-radius:50%;border:none;
  background:var(--surface2);color:var(--text-2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  transition:background var(--ease),color var(--ease),transform var(--ease);
}
.icon-btn:active{transform:scale(.9);}
.icon-btn.active-tint{background:rgba(124,109,240,.15);color:var(--primary);}

.back-btn{
  display:flex;align-items:center;gap:2px;
  color:var(--primary);font-size:15px;font-weight:600;
  background:none;border:none;cursor:pointer;
  padding:6px 6px 6px 0;flex-shrink:0;
}

/* ── HOME ───────────────────────────────────────────── */

/* Search trigger */
.search-trigger{
  margin:14px 16px 0;
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--r);
  padding:11px 14px;
  display:flex;align-items:center;gap:10px;
  cursor:pointer;
  transition:border-color var(--ease),box-shadow var(--ease);
  flex-shrink:0;
}
.search-trigger:active{border-color:var(--primary);}
.search-trigger-text{color:var(--text-3);font-size:14px;flex:1;}
.search-trigger-recent{
  background:var(--surface2);border-radius:6px;
  padding:3px 8px;font-size:11px;font-weight:600;color:var(--text-3);
  white-space:nowrap;
}

/* Section */
.sec{padding:20px 16px 10px;}
.sec-label{
  font-size:11px;font-weight:700;letter-spacing:.7px;
  text-transform:uppercase;color:var(--text-3);
  display:flex;align-items:center;justify-content:space-between;
}
.sec-label-count{
  font-size:11px;letter-spacing:0;text-transform:none;
  color:var(--text-3);font-weight:500;
}

/* Quick strip */
.quick-strip{
  display:flex;gap:10px;
  padding:12px 16px 4px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.quick-strip::-webkit-scrollbar{display:none;}

.qcard{
  flex-shrink:0;width:155px;
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--r);padding:12px;
  cursor:pointer;
  display:flex;flex-direction:column;gap:5px;
  transition:border-color var(--ease),transform var(--ease);
  position:relative;overflow:hidden;
}
.qcard:active{transform:scale(.96);}
.qcard.flash{border-color:var(--green);}

.qcard-badge{
  display:inline-flex;align-items:center;gap:3px;
  font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  color:var(--text-3);
}
.qcard-badge.pinned{color:var(--primary);}
.qcard-title{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qcard-preview{font-size:12px;color:var(--text-2);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

.copied-pop{
  position:absolute;top:7px;right:8px;
  background:var(--green);color:#0a1f14;
  font-size:10px;font-weight:700;padding:2px 8px;
  border-radius:10px;pointer-events:none;
  animation:pop .85s ease forwards;
}
@keyframes pop{
  0%{opacity:0;transform:translateY(3px) scale(.9);}
  15%{opacity:1;transform:translateY(0) scale(1);}
  70%{opacity:1;}
  100%{opacity:0;transform:translateY(-8px);}
}

.quick-empty{
  flex-shrink:0;
  padding:14px 18px;
  background:var(--surface);border:1.5px dashed var(--border);
  border-radius:var(--r);color:var(--text-3);font-size:13px;
  display:flex;align-items:center;gap:8px;white-space:nowrap;
}

/* Folder grid */
.folder-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:12px;padding:12px 16px calc(100px + var(--sb));
}

.fcard{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--r);
  padding:16px 14px 14px;
  cursor:pointer;min-height:118px;
  display:flex;flex-direction:column;gap:10px;
  transition:border-color var(--ease),transform var(--ease);
  overflow:hidden;position:relative;
}
.fcard:active{transform:scale(.96);}

.fcard-icon{
  width:42px;height:42px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
}
.fcard-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fcard-count{font-size:12px;color:var(--text-3);}

.fcard-add{
  background:transparent;border-style:dashed;
  color:var(--text-3);
  align-items:center;justify-content:center;gap:6px;
  font-size:13px;font-weight:500;
  min-height:118px;
}
.fcard-add:active{border-color:var(--primary);color:var(--primary);}

/* FAB */
.fab{
  position:fixed;right:20px;
  bottom:calc(20px + var(--sb));
  width:54px;height:54px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--primary),var(--pri-d));
  color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  box-shadow:0 6px 22px rgba(124,109,240,.5);
  transition:transform var(--ease),box-shadow var(--ease),opacity var(--ease);
  z-index:20;
}
.fab:active{transform:scale(.92);}
.fab.hidden{opacity:0;pointer-events:none;transform:scale(.7);}

/* ── FOLDER SCREEN ──────────────────────────────────── */
.folder-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

/* Snippet list */
.snip-list{display:flex;flex-direction:column;}

.snip-row{
  display:flex;align-items:center;gap:12px;
  padding:13px 16px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  transition:background var(--ease);
}
.snip-row:active{background:var(--surface2);}
.snip-row:first-child{border-top:1px solid var(--border);}

.snip-left{flex:1;min-width:0;}
.snip-title{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
.snip-title.dim{color:var(--text-3);font-style:italic;}
.snip-preview{font-size:13px;color:var(--text-2);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:pre-wrap;word-break:break-word;}
.snip-meta{display:flex;align-items:center;gap:6px;margin-top:4px;}
.pin-pip{width:6px;height:6px;border-radius:50%;background:var(--primary);}
.snip-copies{font-size:11px;color:var(--text-3);display:flex;align-items:center;gap:3px;}

.copy-btn{
  width:36px;height:36px;border-radius:var(--r-sm);border:none;
  background:var(--surface2);color:var(--text-2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  transition:background var(--ease),color var(--ease),transform var(--ease);
}
.copy-btn:active{transform:scale(.88);}
.copy-btn.ok{background:rgba(52,211,153,.15);color:var(--green);}

.folder-empty{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;padding:64px 24px;
  color:var(--text-3);text-align:center;
}
.folder-empty h3{font-size:15px;color:var(--text-2);}
.folder-empty p{font-size:13px;line-height:1.6;}

/* ── SEARCH SCREEN ──────────────────────────────────── */
.search-hdr{
  padding:calc(12px + var(--st)) 12px 12px;
  display:flex;align-items:center;gap:10px;
  background:var(--bg);flex-shrink:0;
  border-bottom:1px solid var(--border);
}
.search-wrap{flex:1;position:relative;}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;}
#searchInput{
  width:100%;padding:10px 36px 10px 36px;
  border-radius:var(--r);border:1.5px solid var(--border);
  background:var(--surface);color:var(--text);
  font-size:15px;outline:none;font-family:inherit;
  transition:border-color var(--ease);
}
#searchInput:focus{border-color:var(--primary);}
#searchInput::placeholder{color:var(--text-3);}
.search-clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:var(--text-3);border:none;border-radius:50%;
  width:18px;height:18px;display:none;align-items:center;justify-content:center;cursor:pointer;color:#fff;
}
.search-clear.show{display:flex;}

.cancel-btn{
  background:none;border:none;color:var(--primary);
  font-size:15px;font-weight:600;cursor:pointer;
  padding:6px 2px;flex-shrink:0;white-space:nowrap;
}

/* Recent searches */
.recent-section{padding:16px 0 0;}
.recent-hdr{
  padding:0 16px 8px;
  display:flex;align-items:center;justify-content:space-between;
}
.recent-hdr-label{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-3);}
.clear-btn{background:none;border:none;color:var(--primary);font-size:13px;font-weight:600;cursor:pointer;}

.recent-row{
  padding:11px 16px;
  display:flex;align-items:center;gap:12px;
  cursor:pointer;transition:background var(--ease);
}
.recent-row:active{background:var(--surface2);}
.recent-row-text{flex:1;font-size:14px;color:var(--text-2);}
.recent-del{background:none;border:none;color:var(--text-3);cursor:pointer;padding:4px;display:flex;align-items:center;}
.recent-del:active{color:var(--red);}

/* Search results */
.result-row{
  padding:13px 16px;
  display:flex;align-items:flex-start;gap:12px;
  border-bottom:1px solid var(--border);
  cursor:pointer;transition:background var(--ease);
}
.result-row:first-child{border-top:1px solid var(--border);}
.result-row:active{background:var(--surface2);}
.result-left{flex:1;min-width:0;}
.result-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px;}
.result-preview{font-size:12px;color:var(--text-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;}
.result-meta{display:flex;align-items:center;gap:5px;margin-top:4px;}
.result-cat{font-size:11px;color:var(--text-3);}
.cat-pip{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
mark{background:rgba(124,109,240,.28);color:var(--accent);border-radius:2px;padding:0 1px;}

.no-results{
  padding:52px 24px;text-align:center;color:var(--text-3);
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.no-results h3{font-size:15px;color:var(--text-2);}
.no-results p{font-size:13px;}

/* ── MODALS ─────────────────────────────────────────── */
.backdrop{
  position:fixed;inset:0;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity .22s;
}
.backdrop.open{opacity:1;pointer-events:all;}

.sheet{
  background:var(--surface);
  border-radius:var(--r) var(--r) 0 0;
  width:100%;max-width:480px;
  padding:8px 20px calc(18px + var(--sb));
  transform:translateY(48px);
  transition:transform .3s cubic-bezier(.34,1.1,.64,1);
  max-height:92dvh;overflow-y:auto;
}
.backdrop.open .sheet{transform:translateY(0);}

.handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 18px;}
.sheet h2{font-size:17px;font-weight:700;margin-bottom:16px;}

/* Fields */
.field{margin-bottom:13px;}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-3);margin-bottom:5px;}
.field input,.field textarea,.field select{
  width:100%;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:var(--r-sm);color:var(--text);font-size:14px;
  padding:10px 12px;outline:none;font-family:inherit;
  transition:border-color var(--ease);
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);}
.field textarea{resize:vertical;min-height:100px;line-height:1.5;}
.field input::placeholder,.field textarea::placeholder{color:var(--text-3);}
.field select{appearance:none;cursor:pointer;}
.char-ct{text-align:right;font-size:11px;color:var(--text-3);margin-top:3px;}

/* Color picker */
.color-row{display:flex;gap:8px;flex-wrap:wrap;padding-top:6px;}
.cdot{
  width:28px;height:28px;border-radius:50%;cursor:pointer;
  border:2.5px solid transparent;
  transition:transform var(--ease),border-color var(--ease);
}
.cdot.on{border-color:var(--text);transform:scale(1.18);}
.cdot:active{transform:scale(.9);}

/* Buttons */
.btn{
  width:100%;padding:13px;border-radius:var(--r-sm);border:none;
  font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
  transition:opacity var(--ease),transform var(--ease);
}
.btn:active{transform:scale(.98);opacity:.9;}
.btn-p{background:linear-gradient(135deg,var(--primary),var(--pri-d));color:#fff;box-shadow:0 4px 16px rgba(124,109,240,.3);}
.btn-g{background:var(--surface2);color:var(--text-2);margin-top:8px;}
.btn-r{background:rgba(248,113,113,.12);color:var(--red);margin-top:8px;}

/* Detail sheet */
.detail-body{
  font-size:14px;line-height:1.65;color:var(--text);
  white-space:pre-wrap;word-break:break-word;
  background:var(--surface2);border-radius:var(--r-sm);
  padding:14px;max-height:42dvh;overflow-y:auto;margin-bottom:12px;
}
.detail-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.detail-meta span{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:4px;}
.detail-row{display:flex;gap:8px;margin-top:8px;}
.detail-row .btn{margin:0;}

/* Confirm */
#dlgConfirm .sheet{text-align:center;padding-bottom:calc(18px + var(--sb));}
.confirm-ico{font-size:36px;margin-bottom:8px;}
#dlgConfirm h3{font-size:16px;margin-bottom:6px;}
#dlgConfirm p{font-size:13px;color:var(--text-2);margin-bottom:18px;}

/* Toast */
#toast{
  position:fixed;bottom:calc(88px + var(--sb));left:50%;
  transform:translateX(-50%) translateY(14px);
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:10px 18px;border-radius:24px;
  font-size:13px;font-weight:500;box-shadow:var(--shadow);
  z-index:500;opacity:0;
  transition:opacity .22s,transform .22s;
  pointer-events:none;white-space:nowrap;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* Scrollbar */
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>
<body>

<!-- ════════════ SCREEN: HOME ════════════ -->
<div id="screen-home" class="screen">
  <div class="hdr">
    <span class="logo-text">copymaster</span>
    <button class="icon-btn" id="btnTheme" title="Tema">
      <svg id="themeIco" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </button>
  </div>

  <div class="scroll-body">
    <!-- Search trigger -->
    <div class="search-trigger" id="searchTrigger">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <span class="search-trigger-text">Cari snippet…</span>
      <span class="search-trigger-recent" id="recentBadge" style="display:none"></span>
    </div>

    <!-- Quick Access -->
    <div class="sec">
      <div class="sec-label">
        <span>Quick Access</span>
        <span class="sec-label-count" id="quickCount"></span>
      </div>
    </div>
    <div class="quick-strip" id="quickStrip"></div>

    <!-- Folders -->
    <div class="sec" style="padding-bottom:8px">
      <div class="sec-label">
        <span>Folder</span>
        <span class="sec-label-count" id="folderCount"></span>
      </div>
    </div>
    <div class="folder-grid" id="folderGrid"></div>
  </div>

  <button class="fab" id="fabHome">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>
</div>

<!-- ════════════ SCREEN: FOLDER ════════════ -->
<div id="screen-folder" class="screen">
  <div class="hdr" id="folderHdr">
    <button class="back-btn" id="btnBackFolder">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <div class="folder-dot" id="folderDot"></div>
    <span class="hdr-title" id="folderTitle"></span>
    <button class="icon-btn" id="btnFolderAdd" title="Tambah snippet">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
  </div>
  <div class="scroll-body">
    <div id="snippetList"></div>
  </div>
</div>

<!-- ════════════ SCREEN: SEARCH ════════════ -->
<div id="screen-search" class="screen">
  <div class="search-hdr">
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input id="searchInput" type="search" placeholder="Cari snippet…" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <button class="search-clear" id="btnClearSearch">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <button class="cancel-btn" id="btnCancelSearch">Batal</button>
  </div>
  <div class="scroll-body" id="searchBody"></div>
</div>

<!-- ════════════ MODALS ════════════ -->

<!-- Add / Edit -->
<div class="backdrop" id="dlgAdd">
  <div class="sheet">
    <div class="handle"></div>
    <h2 id="dlgAddTitle">Snippet Baru</h2>
    <div class="field">
      <label>Judul <span style="color:var(--text-3);font-size:10px;font-weight:400;letter-spacing:0;text-transform:none">(opsional)</span></label>
      <input id="inTitle" type="text" placeholder="cth. Salam Pembuka WA" maxlength="80" autocomplete="off">
    </div>
    <div class="field">
      <label>Konten *</label>
      <textarea id="inContent" placeholder="Tempelkan atau ketik teks di sini…" maxlength="5000"></textarea>
      <div class="char-ct"><span id="charCt">0</span>/5000</div>
    </div>
    <div class="field">
      <label>Simpan ke Folder</label>
      <select id="inCat"></select>
    </div>
    <button class="btn btn-p" id="btnSave">Simpan</button>
    <button class="btn btn-g" id="btnCancelAdd">Batal</button>
  </div>
</div>

<!-- Add Folder -->
<div class="backdrop" id="dlgFolder">
  <div class="sheet">
    <div class="handle"></div>
    <h2>Folder Baru</h2>
    <div class="field">
      <label>Nama Folder</label>
      <input id="inFolderName" type="text" placeholder="cth. Kerja, Pelanggan…" maxlength="30" autocomplete="off">
    </div>
    <div class="field">
      <label>Warna</label>
      <div class="color-row" id="colorRow"></div>
    </div>
    <button class="btn btn-p" id="btnSaveFolder">Buat Folder</button>
    <button class="btn btn-g" id="btnCancelFolder">Batal</button>
  </div>
</div>

<!-- Detail -->
<div class="backdrop" id="dlgDetail">
  <div class="sheet">
    <div class="handle"></div>
    <h2 id="dtTitle"></h2>
    <div class="detail-meta" id="dtMeta"></div>
    <div class="detail-body" id="dtBody"></div>
    <button class="btn btn-p" id="btnDtCopy"><span>Salin ke Clipboard</span></button>
    <div class="detail-row">
      <button class="btn btn-g" id="btnDtEdit">Edit</button>
      <button class="btn btn-g" id="btnDtPin">Pin</button>
      <button class="btn btn-r" id="btnDtDelete">Hapus</button>
    </div>
  </div>
</div>

<!-- Confirm -->
<div class="backdrop" id="dlgConfirm">
  <div class="sheet">
    <div class="handle"></div>
    <div class="confirm-ico" id="cfmIco">🗑️</div>
    <h3 id="cfmTitle"></h3>
    <p id="cfmDesc"></p>
    <button class="btn btn-r" id="btnCfmOk">Hapus</button>
    <button class="btn btn-g" id="btnCfmCancel">Batal</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════
   DATA & STORAGE
═══════════════════════════════════════════ */
const K = {items:'cm2_items',cats:'cm2_cats',theme:'cm_theme',recent:'cm2_recent'};
const CLRS = ['#7c6df0','#a78bfa','#34d399','#fbbf24','#f87171','#38bdf8','#fb923c','#e879f9'];
const DEF_CATS = [
  {id:'work',    name:'Kerja',    color:'#38bdf8'},
  {id:'personal',name:'Personal', color:'#34d399'},
];

let items        = jload(K.items)  || [];
let cats         = jload(K.cats)   || [...DEF_CATS];
let recentQ      = jload(K.recent) || [];
let selColor     = CLRS[0];
let curFolder    = null; // current folder catId
let detailId     = null;
let editingId    = null;
let addFolderPre = null; // folder preset for add modal
let cfmCb        = null;

function jload(k){try{return JSON.parse(localStorage.getItem(k));}catch{return null;}}
function jsave(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ═══════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════ */
let navStack = ['home'];

function push(id, setup) {
  const from = navStack[navStack.length - 1];
  navStack.push(id);

  const fromEl = document.getElementById('screen-' + from);
  const toEl   = document.getElementById('screen-' + id);

  toEl.style.transition = 'none';
  toEl.style.transform  = 'translateX(100%)';
  toEl.offsetHeight;
  toEl.style.transition = '';

  if (setup) setup();

  fromEl.classList.add('behind');
  toEl.classList.add('active');
  history.pushState({scr: id}, '');
}

function pop() {
  if (navStack.length <= 1) return;
  const cur  = navStack.pop();
  const prev = navStack[navStack.length - 1];

  document.getElementById('screen-' + cur).classList.remove('active');
  document.getElementById('screen-' + prev).classList.remove('behind');
  if (prev === 'home') { curFolder = null; renderHome(); }
}

window.addEventListener('popstate', () => {
  if (navStack.length > 1) pop();
});

/* ═══════════════════════════════════════════
   HOME
═══════════════════════════════════════════ */
function renderHome() {
  renderQuick();
  renderFolders();
  renderSearchTrigger();
}

function renderSearchTrigger() {
  const badge = document.getElementById('recentBadge');
  if (recentQ.length > 0) {
    badge.textContent = recentQ[0];
    badge.style.display = '';
  } else {
    badge.style.display = 'none';
  }
}

function renderQuick() {
  const el = document.getElementById('quickStrip');
  const ct = document.getElementById('quickCount');

  const pinned = items.filter(i => i.pinned);
  const freq   = items
    .filter(i => !i.pinned && (i.copyCount||0) > 0)
    .sort((a,b) => (b.copyCount||0)-(a.copyCount||0))
    .slice(0, 5);
  const list = [...pinned, ...freq].slice(0, 8);

  ct.textContent = list.length > 0 ? list.length + ' item' : '';

  if (list.length === 0) {
    el.innerHTML = `<div class="quick-empty">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      Pin snippet untuk akses cepat
    </div>`;
    return;
  }

  el.innerHTML = list.map(item => `
    <div class="qcard" data-qid="${item.id}">
      <div class="qcard-badge ${item.pinned ? 'pinned' : ''}">
        ${item.pinned
          ? `<svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg> Pinned`
          : `<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Sering`}
      </div>
      <div class="qcard-title">${esc(item.title||'Tanpa judul')}</div>
      <div class="qcard-preview">${esc(item.content)}</div>
    </div>`).join('');

  el.querySelectorAll('.qcard').forEach(c => {
    c.addEventListener('click', async () => {
      const item = items.find(i => i.id === c.dataset.qid);
      if (!item) return;
      if (await copy(item.content)) {
        item.copyCount = (item.copyCount||0) + 1;
        jsave(K.items, items);
        c.classList.add('flash');
        const pop = Object.assign(document.createElement('div'),{className:'copied-pop',textContent:'✓ Tersalin'});
        c.appendChild(pop);
        setTimeout(() => { c.classList.remove('flash'); pop.remove(); }, 920);
        toast('📋 Tersalin ke clipboard');
      }
    });
  });
}

function renderFolders() {
  const el = document.getElementById('folderGrid');
  const ct = document.getElementById('folderCount');
  ct.textContent = cats.length + ' folder';

  el.innerHTML = cats.map(cat => {
    const n = items.filter(i => i.category === cat.id).length;
    return `<div class="fcard" data-fid="${cat.id}">
      <div class="fcard-icon" style="background:${cat.color}22">${folderIco(cat.color)}</div>
      <div>
        <div class="fcard-name">${esc(cat.name)}</div>
        <div class="fcard-count">${n} snippet</div>
      </div>
    </div>`;
  }).join('') + `<div class="fcard fcard-add" id="addFolderCard">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    Folder Baru
  </div>`;

  el.querySelectorAll('.fcard[data-fid]').forEach(c =>
    c.addEventListener('click', () => openFolder(c.dataset.fid))
  );
  document.getElementById('addFolderCard').addEventListener('click', openAddFolderDlg);
}

function folderIco(color) {
  return `<svg width="22" height="22" viewBox="0 0 24 22" fill="none">
    <path d="M1 5a2 2 0 012-2h5l2 2h11a2 2 0 012 2v11a2 2 0 01-2 2H3a2 2 0 01-2-2V5z" fill="${color}" opacity=".85"/>
  </svg>`;
}

/* ═══════════════════════════════════════════
   FOLDER SCREEN
═══════════════════════════════════════════ */
function openFolder(catId) {
  curFolder = catId;
  const cat = cats.find(c => c.id === catId) || {};
  push('folder', () => {
    document.getElementById('folderTitle').textContent = cat.name || 'Folder';
    document.getElementById('folderDot').style.background = cat.color || 'var(--primary)';
    renderSnippets(catId);
  });
}

function renderSnippets(catId) {
  const el = document.getElementById('snippetList');
  let list = items.filter(i => i.category === catId)
    .sort((a,b) => {
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      return b.createdAt - a.createdAt;
    });

  if (list.length === 0) {
    el.innerHTML = `<div class="folder-empty">
      <svg width="50" height="50" viewBox="0 0 24 22" fill="none" opacity=".3">
        <path d="M1 5a2 2 0 012-2h5l2 2h11a2 2 0 012 2v11a2 2 0 01-2 2H3a2 2 0 01-2-2V5z" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <h3>Folder masih kosong</h3>
      <p>Ketuk <strong>+</strong> di pojok kanan atas<br>untuk menambah snippet pertama</p>
    </div>`;
    return;
  }

  el.innerHTML = `<div class="snip-list">${list.map(snipRowHTML).join('')}</div>`;

  el.querySelectorAll('.snip-row').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('.copy-btn')) return;
      openDetail(row.dataset.sid);
    });
  });

  el.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const item = items.find(i => i.id === btn.dataset.sid);
      if (!item) return;
      if (await copy(item.content)) {
        item.copyCount = (item.copyCount||0) + 1;
        jsave(K.items, items);
        btn.classList.add('ok');
        btn.innerHTML = checkIco();
        setTimeout(() => { btn.classList.remove('ok'); btn.innerHTML = copyIco(); }, 1300);
        toast('📋 Tersalin ke clipboard');
      }
    });
  });
}

function snipRowHTML(item) {
  return `<div class="snip-row" data-sid="${item.id}">
    <div class="snip-left">
      <div class="snip-title${!item.title?' dim':''}">${esc(item.title||'Tanpa judul')}</div>
      <div class="snip-preview">${esc(item.content)}</div>
      <div class="snip-meta">
        ${item.pinned ? '<div class="pin-pip"></div>' : ''}
        ${(item.copyCount||0)>0 ? `<span class="snip-copies">${copyIco(10)} ${item.copyCount}×</span>` : ''}
      </div>
    </div>
    <button class="copy-btn" data-sid="${item.id}" title="Salin">${copyIco()}</button>
  </div>`;
}

function copyIco(s=16) {
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="9" y="9" width="13" height="13" rx="2"/>
    <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
  </svg>`;
}
function checkIco() {
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;
}

/* ═══════════════════════════════════════════
   SEARCH SCREEN
═══════════════════════════════════════════ */
function openSearch() {
  push('search', () => {
    const inp = document.getElementById('searchInput');
    inp.value = '';
    document.getElementById('btnClearSearch').classList.remove('show');
    renderSearchBody('');
    setTimeout(() => inp.focus(), 300);
  });
}

function renderSearchBody(q) {
  const el = document.getElementById('searchBody');
  if (!q.trim()) {
    renderRecent(el);
  } else {
    renderResults(el, q.trim());
  }
  const cls = document.getElementById('btnClearSearch').classList;
  q ? cls.add('show') : cls.remove('show');
}

function renderRecent(el) {
  if (recentQ.length === 0) {
    el.innerHTML = `<div class="no-results" style="padding-top:36px">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".3">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <h3>Belum ada pencarian</h3>
      <p>Ketik untuk mulai mencari snippet</p>
    </div>`;
    return;
  }

  el.innerHTML = `<div class="recent-section">
    <div class="recent-hdr">
      <span class="recent-hdr-label">Pencarian Terakhir</span>
      <button class="clear-btn" id="btnClearAll">Hapus semua</button>
    </div>
    ${recentQ.map((q,i) => `
      <div class="recent-row" data-ri="${i}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" opacity=".5">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <span class="recent-row-text">${esc(q)}</span>
        <button class="recent-del" data-ri="${i}" title="Hapus">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>`).join('')}
  </div>`;

  el.querySelectorAll('.recent-row').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('.recent-del')) return;
      const q = recentQ[+row.dataset.ri];
      if (!q) return;
      document.getElementById('searchInput').value = q;
      renderSearchBody(q);
    });
  });

  el.querySelectorAll('.recent-del').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      recentQ.splice(+btn.dataset.ri, 1);
      jsave(K.recent, recentQ);
      renderRecent(el);
      renderSearchTrigger();
    });
  });

  document.getElementById('btnClearAll')?.addEventListener('click', () => {
    recentQ = [];
    jsave(K.recent, recentQ);
    renderRecent(el);
    renderSearchTrigger();
  });
}

function renderResults(el, q) {
  const low = q.toLowerCase();
  const res = items
    .filter(i => (i.title||'').toLowerCase().includes(low) || (i.content||'').toLowerCase().includes(low))
    .sort((a,b) => b.createdAt - a.createdAt);

  if (res.length === 0) {
    el.innerHTML = `<div class="no-results">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".3">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <h3>Tidak ada hasil</h3>
      <p>Coba kata kunci yang berbeda</p>
    </div>`;
    return;
  }

  el.innerHTML = res.map(item => {
    const cat = cats.find(c => c.id === item.category) || {};
    return `<div class="result-row" data-rid="${item.id}">
      <div class="result-left">
        <div class="result-title">${hl(item.title||'Tanpa judul', q)}</div>
        <div class="result-preview">${hl(item.content, q)}</div>
        <div class="result-meta">
          <div class="cat-pip" style="background:${cat.color||'var(--text-3)'}"></div>
          <span class="result-cat">${esc(cat.name||'')}</span>
        </div>
      </div>
      <button class="copy-btn" data-rid="${item.id}" title="Salin">${copyIco()}</button>
    </div>`;
  }).join('');

  el.querySelectorAll('.result-row').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('.copy-btn')) return;
      saveRecent(q);
      openDetail(row.dataset.rid);
    });
  });

  el.querySelectorAll('.copy-btn[data-rid]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const item = items.find(i => i.id === btn.dataset.rid);
      if (!item) return;
      if (await copy(item.content)) {
        item.copyCount = (item.copyCount||0)+1;
        jsave(K.items, items);
        saveRecent(q);
        btn.classList.add('ok'); btn.innerHTML = checkIco();
        setTimeout(() => { btn.classList.remove('ok'); btn.innerHTML = copyIco(); }, 1300);
        toast('📋 Tersalin ke clipboard');
      }
    });
  });
}

function saveRecent(q) {
  if (!q?.trim()) return;
  recentQ = [q, ...recentQ.filter(r => r !== q)].slice(0, 8);
  jsave(K.recent, recentQ);
  renderSearchTrigger();
}

function hl(text, q) {
  if (!text || !q) return esc(text||'');
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  const parts = text.split(re);
  const matches = text.match(re) || [];
  return parts.map((p,i) => esc(p) + (matches[i] ? `<mark>${esc(matches[i])}</mark>` : '')).join('');
}

/* ═══════════════════════════════════════════
   DETAIL
═══════════════════════════════════════════ */
function openDetail(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  detailId = id;
  const cat = cats.find(c => c.id === item.category) || {};

  document.getElementById('dtTitle').textContent = item.title || 'Tanpa judul';
  document.getElementById('dtBody').textContent  = item.content;
  document.getElementById('dtMeta').innerHTML = [
    `<span>${fmtDate(item.createdAt)}</span>`,
    cat.name ? `<span style="color:${cat.color||'var(--text-3)'}">📁 ${esc(cat.name)}</span>` : '',
    (item.copyCount||0)>0 ? `<span>Disalin ${item.copyCount}×</span>` : '',
    item.pinned ? `<span style="color:var(--primary)">📌 Pinned</span>` : '',
  ].filter(Boolean).join('');
  document.getElementById('btnDtPin').textContent = item.pinned ? 'Unpin' : 'Pin';
  openDlg('dlgDetail');
}

/* ═══════════════════════════════════════════
   ADD / EDIT MODAL
═══════════════════════════════════════════ */
function openAdd(folderPreset) {
  editingId    = null;
  addFolderPre = folderPreset || curFolder || cats[0]?.id;
  document.getElementById('dlgAddTitle').textContent = 'Snippet Baru';
  document.getElementById('inTitle').value   = '';
  document.getElementById('inContent').value = '';
  updateCharCt();
  fillCatSelect(addFolderPre);
  openDlg('dlgAdd');
  setTimeout(() => document.getElementById('inContent').focus(), 320);
}

function openEdit(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  editingId    = id;
  addFolderPre = null;
  closeDlg('dlgDetail');
  document.getElementById('dlgAddTitle').textContent = 'Edit Snippet';
  document.getElementById('inTitle').value   = item.title || '';
  document.getElementById('inContent').value = item.content || '';
  updateCharCt();
  fillCatSelect(item.category);
  openDlg('dlgAdd');
}

function fillCatSelect(sel) {
  document.getElementById('inCat').innerHTML =
    cats.map(c => `<option value="${c.id}"${c.id===sel?' selected':''}>${esc(c.name)}</option>`).join('');
}

function saveItem() {
  const title   = document.getElementById('inTitle').value.trim();
  const content = document.getElementById('inContent').value.trim();
  const catId   = document.getElementById('inCat').value;
  if (!content) { shake(document.getElementById('inContent')); toast('⚠️ Konten tidak boleh kosong'); return; }

  if (editingId) {
    const it = items.find(i => i.id === editingId);
    if (it) { it.title = title; it.content = content; it.category = catId; it.updatedAt = Date.now(); }
    toast('✏️ Snippet diperbarui');
  } else {
    items.unshift({id:uid(), title, content, category:catId, pinned:false, createdAt:Date.now(), copyCount:0});
    toast('✅ Snippet disimpan');
  }
  jsave(K.items, items);
  closeDlg('dlgAdd');
  if (curFolder) renderSnippets(curFolder);
  renderHome();
}

/* ═══════════════════════════════════════════
   FOLDER DIALOG
═══════════════════════════════════════════ */
function openAddFolderDlg() {
  document.getElementById('inFolderName').value = '';
  selColor = CLRS[0];
  renderColorRow();
  openDlg('dlgFolder');
  setTimeout(() => document.getElementById('inFolderName').focus(), 320);
}

function renderColorRow() {
  document.getElementById('colorRow').innerHTML = CLRS.map(c =>
    `<div class="cdot${c===selColor?' on':''}" style="background:${c}" data-c="${c}"></div>`
  ).join('');
  document.querySelectorAll('.cdot').forEach(d => {
    d.addEventListener('click', () => { selColor = d.dataset.c; renderColorRow(); });
  });
}

function saveFolder() {
  const name = document.getElementById('inFolderName').value.trim();
  if (!name) { shake(document.getElementById('inFolderName')); return; }
  if (cats.find(c => c.name.toLowerCase() === name.toLowerCase())) { toast('⚠️ Folder sudah ada'); return; }
  cats.push({id:uid(), name, color:selColor});
  jsave(K.cats, cats);
  closeDlg('dlgFolder');
  renderFolders();
  toast('📁 Folder dibuat');
}

/* ═══════════════════════════════════════════
   CONFIRM / DELETE
═══════════════════════════════════════════ */
function confirmDel(id) {
  const item = items.find(i => i.id === id);
  document.getElementById('cfmIco').textContent   = '🗑️';
  document.getElementById('cfmTitle').textContent = 'Hapus snippet ini?';
  document.getElementById('cfmDesc').textContent  = item?.title ? `"${item.title}" akan dihapus permanen.` : 'Snippet ini akan dihapus permanen.';
  document.getElementById('btnCfmOk').className   = 'btn btn-r';
  document.getElementById('btnCfmOk').textContent = 'Hapus';
  cfmCb = () => {
    items = items.filter(i => i.id !== id);
    jsave(K.items, items);
    closeDlg('dlgDetail');
    if (curFolder) renderSnippets(curFolder);
    renderHome();
    toast('Snippet dihapus');
  };
  openDlg('dlgConfirm');
}

/* ═══════════════════════════════════════════
   COPY
═══════════════════════════════════════════ */
async function copy(text) {
  try {
    if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); return true; }
    const ta = Object.assign(document.createElement('textarea'),{value:text,style:'position:fixed;opacity:0'});
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy'); ta.remove(); return true;
  } catch { return false; }
}

/* ═══════════════════════════════════════════
   DIALOGS
═══════════════════════════════════════════ */
function openDlg(id) {
  document.getElementById(id).classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeDlg(id) {
  document.getElementById(id).classList.remove('open');
  if (!document.querySelector('.backdrop.open')) document.body.style.overflow = '';
}
document.querySelectorAll('.backdrop').forEach(b =>
  b.addEventListener('click', e => { if (e.target === b) closeDlg(b.id); })
);

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
let toastTimer;
function toast(msg, ms=2000) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), ms);
}

/* ═══════════════════════════════════════════
   UTILS
═══════════════════════════════════════════ */
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
}
function shake(el) {
  el.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:300});
}
function updateCharCt() {
  document.getElementById('charCt').textContent = document.getElementById('inContent').value.length;
}

/* ═══════════════════════════════════════════
   THEME
═══════════════════════════════════════════ */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  jsave(K.theme, t);
  document.querySelector('meta[name="theme-color"]').content = t==='light' ? '#f0f0f8' : '#0f0f17';
  document.getElementById('themeIco').innerHTML = t==='light'
    ? '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="currentColor" stroke="none"/>'
    : '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
}

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const open = [...document.querySelectorAll('.backdrop.open')].pop();
    if (open) { closeDlg(open.id); return; }
    if (navStack.length > 1) pop();

    if (document.getElementById('dlgAdd').classList.contains('open')) saveItem();

});
